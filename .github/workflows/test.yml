name: tests
run-name: Run test suites
on: pull_request
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: ./.github/actions/setup
      - name: Prefetch deps
        shell: bash
        run: |
          clojure -P -M:test:cms
          clojure -P -M:cms:dev:tools

  run-unit-and-integration-tests:
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v3
      - uses: ./.github/actions/setup
      - name: Run unit and integration tests
        run: bin/run-tests cms

  run-e2e-tests:
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v3
      - uses: ./.github/actions/setup
      - name: Run end-to-end tests
        run: |
          clojure -M:cms:dev:tools -m systems.bread.alpha.dev.main -f dev/main.edn &
          timeout 60 bash -c 'until curl -s -o /dev/null http://localhost:1312/; do sleep 1; done'
          bin/run-tests e2e
