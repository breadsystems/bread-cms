name: tests
run-name: Run unit tests
on: pull_request
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Install Clojure tools
        uses: DeLaGuardo/setup-clojure@10.1
        with:
          cli: 1.11.1.1224

      - name: Cache Clojure deps
        uses: actions/cache@v3
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: cljdeps-${{ hashFiles('deps.edn') }}

  run-unit-and-integration-tests:
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Run unit/integration tests
        run: bin/run-tests cms

  run-e2e-tests:
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Run end-to-end tests
        run: |
          clojure -M:cms:dev:tools -m systems.bread.alpha.dev.main -f dev/main.edn &
          timeout 60 bash -c 'until curl -s -o /dev/null http://localhost:1312/; do sleep 1; done'
          bin/run-tests e2e
